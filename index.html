<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCT Academy · Electronic Health Record</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./public/assets/styles.css">
</head>
<body>
  <!-- Single mount point; modules render into #app. -->
  <div id="app"></div>
  <div id="toasts"></div>

  <!-- No build step: native ES modules. Deploys to GitHub Pages as-is.
       Import map lets us upgrade the Supabase SDK in one place. -->
  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
